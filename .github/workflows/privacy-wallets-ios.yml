name: Privacy Wallets iOS

on:
  push:
    branches: [main]
    tags: ["xmr-v*", "zec-v*", "pwallet-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-wallets-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select products
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.products.outputs.matrix }}
    steps:
      - name: Build product matrix
        id: products
        env:
          BUILD_REF: ${{ github.ref }}
        run: |
          all_products='{"include":[{"app_type":"onekey-xmr","artifact":"xmr-wallet","display_name":"XMR Wallet","tag_prefix":"xmr-v"},{"app_type":"onekey-zec","artifact":"zec-wallet","display_name":"ZEC Wallet","tag_prefix":"zec-v"},{"app_type":"pwallet","artifact":"pwallet","display_name":"PWallet","tag_prefix":"pwallet-v"}]}'
          case "$BUILD_REF" in
            refs/tags/xmr-v*)
              matrix='{"include":[{"app_type":"onekey-xmr","artifact":"xmr-wallet","display_name":"XMR Wallet","tag_prefix":"xmr-v"}]}'
              ;;
            refs/tags/zec-v*)
              matrix='{"include":[{"app_type":"onekey-zec","artifact":"zec-wallet","display_name":"ZEC Wallet","tag_prefix":"zec-v"}]}'
              ;;
            refs/tags/pwallet-v*)
              matrix='{"include":[{"app_type":"pwallet","artifact":"pwallet","display_name":"PWallet","tag_prefix":"pwallet-v"}]}'
              ;;
            *)
              matrix="$all_products"
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.display_name }} iOS
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build tools
        run: brew install automake cmake coreutils libtool pkg-config

      - name: Verify tag matches product version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pushd scripts/ios >/dev/null
          source ./app_env.sh "${{ matrix.app_type }}"
          popd >/dev/null
          test "$GITHUB_REF_NAME" = "${APP_IOS_TAG_PREFIX}${APP_IOS_VERSION}"

      - name: Build unsigned IPA
        env:
          IOS_NO_CODESIGN: "1"
        run: ./scripts/ios/build_wallet.sh "${{ matrix.app_type }}"

      - name: Verify IPA metadata
        run: |
          pushd scripts/ios >/dev/null
          source ./app_env.sh "${{ matrix.app_type }}"
          popd >/dev/null
          output_dir="dist/ios/${APP_IOS_ARTIFACT}/v${APP_IOS_VERSION}"
          pushd "$output_dir" >/dev/null
          shasum -a 256 -c SHA256SUMS
          test -f "${APP_IOS_ARTIFACT}-${APP_IOS_VERSION}-unsigned.ipa"
          popd >/dev/null

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-ios-unsigned-${{ github.sha }}
          path: dist/ios/${{ matrix.artifact }}/v*/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish ${{ matrix.display_name }} unsigned IPA
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, build]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download IPA
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}-ios-unsigned-${{ github.sha }}
          path: release-artifacts

      - name: Add unsigned IPA to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*-unsigned.ipa
            release-artifacts/**/SHA256SUMS
