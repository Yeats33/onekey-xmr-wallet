name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository files
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD

      - name: Validate maintained shell entrypoints
        run: |
          bash -n \
            configure_wallet.sh \
            configure_onekey_xmr.sh \
            configure_onekey_zec.sh \
            configure_pwallet.sh \
            configure_wallet_ios.sh \
            scripts/android/build_wallet.sh \
            scripts/android/build_onekey_xmr.sh \
            scripts/android/build_onekey_zec.sh \
            scripts/android/build_pwallet.sh \
            scripts/ios/build_wallet.sh \
            scripts/ios/restore_ci_dependencies.sh \
            scripts/ios/build_onekey_xmr.sh \
            scripts/ios/build_onekey_zec.sh \
            scripts/ios/build_pwallet.sh
