name: Privacy Wallets Android

on:
  push:
    branches: [main]
    tags: ["xmr-v*", "zec-v*", "pwallet-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

concurrency:
  group: privacy-wallets-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select products
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.products.outputs.matrix }}
    steps:
      - name: Build product matrix
        id: products
        env:
          BUILD_REF: ${{ github.ref }}
        run: |
          all_products='{"include":[{"app_type":"onekey-xmr","artifact":"xmr-wallet","package_id":"com.yeats33.xmrwallet","display_name":"XMR Wallet","tag_prefix":"xmr-v"},{"app_type":"onekey-zec","artifact":"zec-wallet","package_id":"com.yeats33.zecwallet","display_name":"ZEC Wallet","tag_prefix":"zec-v"},{"app_type":"pwallet","artifact":"pwallet","package_id":"com.yeats33.pwallet","display_name":"PWallet","tag_prefix":"pwallet-v"}]}'
          case "$BUILD_REF" in
            refs/tags/xmr-v*)
              matrix='{"include":[{"app_type":"onekey-xmr","artifact":"xmr-wallet","package_id":"com.yeats33.xmrwallet","display_name":"XMR Wallet","tag_prefix":"xmr-v"}]}'
              ;;
            refs/tags/zec-v*)
              matrix='{"include":[{"app_type":"onekey-zec","artifact":"zec-wallet","package_id":"com.yeats33.zecwallet","display_name":"ZEC Wallet","tag_prefix":"zec-v"}]}'
              ;;
            refs/tags/pwallet-v*)
              matrix='{"include":[{"app_type":"pwallet","artifact":"pwallet","package_id":"com.yeats33.pwallet","display_name":"PWallet","tag_prefix":"pwallet-v"}]}'
              ;;
            *)
              matrix="$all_products"
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.display_name }} Android
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android SDK components
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null
          "$sdkmanager_path" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y build-essential file unzip

      - name: Restore pinned native dependencies
        run: ./scripts/android/restore_ci_dependencies.sh "${{ matrix.app_type }}"

      - name: Configure product
        run: ./configure_wallet.sh "${{ matrix.app_type }}"

      - name: Verify tag matches product version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pushd scripts/android >/dev/null
          source ./app_env.sh "${{ matrix.app_type }}"
          popd >/dev/null
          test "$GITHUB_REF_NAME" = "${APP_ANDROID_TAG_PREFIX}${APP_ANDROID_VERSION}"

      - name: Run wallet tests
        run: |
          flutter test \
            --dart-define="PRODUCT_FLAVOR=${{ matrix.app_type }}" \
            test/product_flavor_test.dart \
            test/wallet_type_matrix_test.dart \
            test/donation_config_test.dart \
            test/onekey_cipher_key_value_test.dart \
            test/onekey_zcash_seed_key_protector_test.dart
          if [[ "${{ matrix.app_type }}" != "onekey-zec" ]]; then
            flutter test \
              test/onekey_native_usb_test.dart \
              test/onekey_native_ble_test.dart
          fi
          pushd cw_core >/dev/null
          flutter test test/hardware_wallet_type_test.dart
          popd >/dev/null

      - name: Configure release signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          dart run tool/generate_android_key_properties.dart \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=key.jks" \
            "storePassword=$STORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD"

      - name: Configure CI signing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          alias="${{ matrix.artifact }}-ci"
          keytool -genkeypair -noprompt \
            -keystore android/app/key.jks \
            -storepass privacy-wallet-ci \
            -keypass privacy-wallet-ci \
            -alias "$alias" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=${{ matrix.display_name }} CI,O=Yeats33,C=DE"
          dart run tool/generate_android_key_properties.dart \
            "keyAlias=$alias" \
            storeFile=key.jks \
            storePassword=privacy-wallet-ci \
            keyPassword=privacy-wallet-ci

      - name: Build signed APKs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./scripts/android/build_wallet.sh "${{ matrix.app_type }}"

      - name: Verify APKs
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          export PATH="$build_tools:$PATH"
          pushd scripts/android >/dev/null
          source ./app_env.sh "${{ matrix.app_type }}"
          popd >/dev/null
          output_dir="dist/android/${APP_ANDROID_ARTIFACT}/v${APP_ANDROID_VERSION}"
          pushd "$output_dir" >/dev/null
          sha256sum -c SHA256SUMS
          popd >/dev/null
          for apk in "$output_dir"/*.apk; do
            apksigner verify "$apk"
            zipalign -c -P 16 4 "$apk"
          done
          aapt dump badging "$output_dir/${APP_ANDROID_ARTIFACT}-${APP_ANDROID_VERSION}-arm64-v8a.apk" | \
            grep "package: name='${APP_ANDROID_PACKAGE}'"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-android-${{ github.sha }}
          path: dist/android/${{ matrix.artifact }}/v*/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish ${{ matrix.display_name }} release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, build]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download signed APKs
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}-android-${{ github.sha }}
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/SHA256SUMS
